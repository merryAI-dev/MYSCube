apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inner-platform-local
resources:
  - namespace.yaml
  - ../../base
  - bff-env-configmap.yaml
patches:
  - target:
      kind: Deployment
      name: mysc-bff
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
