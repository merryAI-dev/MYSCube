steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'Dockerfile', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --network=none
      - '${_IMAGE}'
      - node
      - --input-type=module
      - -e
      - "await Promise.all(['publication-worker','issue-delivery','issue-cloud-store','issue-source-proof','issue-publication-model','github-issue-client','tool-discovery','openai-agent','review-sessions','review-claims','review-evidence-join'].map(name => import('./'+name+'.mjs'))); console.log('investigator_and_publication_modules_imported')"
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
