name: Settlement Agent Slack Check

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send one connection test to C0BQ6980HR6 (no model call or settlement data)'
        type: boolean
        required: true
        default: false
      check_model:
        description: 'Check configured Gemini model with a benign prompt (no business data)'
        type: boolean
        default: false
      check_runtime:
        description: 'Verify live Slack signatures and worker authentication without data writes'
        type: boolean
        default: false
      inspect_firewall:
        description: 'Read current Cloudflare custom rules before scoped Slack exceptions'
        type: boolean
        default: false
      apply_slack_exception:
        description: 'Apply reviewed two-POST-path exception to automation-client block only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: settlement-agent-slack-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing Slack identity and optionally send test
        env:
          SLACK_ALERT_BOT_TOKEN: ${{ secrets.SLACK_ALERT_BOT_TOKEN }}
          SEND_TEST: ${{ inputs.send_test }}
        run: |
          if [ "$SEND_TEST" = "true" ]; then
            node scripts/check-settlement-slack.mjs --send-test
          else
            node scripts/check-settlement-slack.mjs
          fi
      - name: Inspect Cloudflare custom rules
        if: inputs.inspect_firewall
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          node --input-type=module <<'JS'
          const { CLOUDFLARE_API_KEY: key, CLOUDFLARE_EMAIL: email, CLOUDFLARE_ZONE_ID: zone } = process.env;
          if (!key || !email || !/^[a-f0-9]{32}$/.test(zone || '')) throw new Error('Cloudflare credentials unavailable');
          const response = await fetch(`https://api.cloudflare.com/client/v4/zones/${zone}/rulesets/phases/http_request_firewall_custom/entrypoint`, {
            headers: { 'X-Auth-Key': key, 'X-Auth-Email': email }, signal: AbortSignal.timeout(15000),
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(`Cloudflare read failed: ${response.status}`);
          console.log(JSON.stringify({ id: result.result.id, rules: result.result.rules.map(({ id, ref, action, expression, enabled }) => ({ id, ref, action, expression, enabled })) }, null, 2));
          JS
      - name: Apply scoped Slack edge exception
        if: inputs.apply_slack_exception
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/configure-slack-edge.mjs
      - name: Preserve pre-change firewall backup
        if: always() && inputs.apply_slack_exception
        uses: actions/upload-artifact@v4
        with:
          name: slack-edge-before
          path: slack-edge-before.json
          retention-days: 30
          if-no-files-found: warn
      - name: Install model SDK
        if: inputs.check_model
        run: npm ci --ignore-scripts
      - name: Verify live runtime
        if: inputs.check_runtime || inputs.apply_slack_exception
        env:
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        run: node scripts/check-settlement-runtime.mjs
      - name: Verify configured Gemini connection
        if: inputs.check_model
        env:
          GEMINI_API_KEY: ${{ secrets.SETTLEMENT_AGENT_GEMINI_API_KEY }}
        run: node scripts/check-settlement-gemini.mjs
      - name: Diagnose blocked Slack probes without changing firewall settings
        if: failure() && (inputs.check_runtime || inputs.apply_slack_exception)
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          node --input-type=module <<'JS'
          const end = new Date(), start = new Date(end.getTime() - 600000);
          const response = await fetch('https://api.cloudflare.com/client/v4/graphql', {
            method: 'POST', headers: { 'X-Auth-Key': process.env.CLOUDFLARE_API_KEY, 'X-Auth-Email': process.env.CLOUDFLARE_EMAIL, 'content-type': 'application/json' },
            body: JSON.stringify({ query: 'query($zone: String!, $start: Time!, $end: Time!) { viewer { zones(filter: {zoneTag: $zone}) { firewallEventsAdaptive(limit: 1000, filter: {datetime_geq: $start, datetime_leq: $end}, orderBy: [datetime_DESC]) { action source ref description clientRequestHTTPHost clientRequestPath edgeResponseStatus userAgent datetime rayName } } } }',
              variables: { zone: process.env.CLOUDFLARE_ZONE_ID, start: start.toISOString().replace(/\.\d{3}Z$/, 'Z'), end: end.toISOString().replace(/\.\d{3}Z$/, 'Z') } }), signal: AbortSignal.timeout(15000),
          });
          const result = await response.json();
          if (!response.ok || result.errors?.length) throw new Error(`Firewall diagnostics unavailable: ${response.status}`);
          const events = result.data.viewer.zones[0]?.firewallEventsAdaptive || [];
          console.log(JSON.stringify(events.filter(e => e.clientRequestHTTPHost === 'myscube.myscguard.app' && ['/api/slack/events', '/api/slack/interactions'].includes(e.clientRequestPath)), null, 2));
          JS
