name: MCP Worker Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mcp-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        target: [myscube, ema, tiro]
    name: deploy (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Verify green CI on current main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          if [ "$(git rev-parse origin/main)" != "$TARGET_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main advanced; skipping superseded ${TARGET_SHA}."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&event=push" \
            --jq '.workflow_runs | any(.conclusion == "success" and .head_branch == "main")' | grep -qx true
      - name: Install root packages used by shared MCP modules
        if: steps.gate.outputs.current == 'true'
        run: npm ci --ignore-scripts
      - name: Install worker packages
        if: steps.gate.outputs.current == 'true'
        working-directory: mcp-worker
        run: npm ci --ignore-scripts
      - name: Deploy and verify MCP discovery
        if: steps.gate.outputs.current == 'true'
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          MCP_GOOGLE_CLIENT_ID: ${{ secrets.MCP_GOOGLE_CLIENT_ID }}
          MCP_GOOGLE_CLIENT_SECRET: ${{ secrets.MCP_GOOGLE_CLIENT_SECRET }}
          MCP_FIREBASE_WEB_API_KEY: ${{ secrets.MCP_FIREBASE_WEB_API_KEY }}
          MCP_CONSENT_SECRET: ${{ secrets.MCP_CONSENT_SECRET }}
          MCP_DOCUMENTS_ORIGIN: ${{ vars.MCP_DOCUMENTS_ACTIVE_ORIGIN }}
          EMA_MCP_FIREBASE_WEB_API_KEY: ${{ secrets.EMA_MCP_FIREBASE_WEB_API_KEY }}
          EMA_MCP_CONSENT_SECRET: ${{ secrets.EMA_MCP_CONSENT_SECRET }}
          EMA_MCP_NOTES_SAVE_URL: ${{ secrets.EMA_MCP_NOTES_SAVE_URL }}
          TIRO_AUTOSAVE_TIRO_API_KEY: ${{ secrets.TIRO_AUTOSAVE_TIRO_API_KEY }}
          TIRO_AUTOSAVE_ANTHROPIC_API_KEY: ${{ secrets.TIRO_AUTOSAVE_ANTHROPIC_API_KEY }}
          TIRO_AUTOSAVE_WEBHOOK_SECRET: ${{ secrets.TIRO_AUTOSAVE_WEBHOOK_SECRET }}
        run: node scripts/deploy-mcp-worker.mjs ${{ matrix.target }}
