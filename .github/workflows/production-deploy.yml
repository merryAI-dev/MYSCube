name: Production Deploy

on:
  # main 의 CI 가 초록이면 자동으로 배포한다. 수동 dispatch 는 CI 가 끝나기 전에 눌리면
  # "Verify CI succeeded" 가드에 걸려 실패하는데, 사람이 그 실패를 보고 다시 누를 때까지
  # 배포된 줄 알았던 커밋이 라이브에 없는 시간이 생긴다. 초록을 기다렸다가 트리거하는
  # 일은 사람이 아니라 GitHub 가 해야 한다.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_alias:
        description: Promote the candidate to the canonical production alias
        required: true
        default: true
        type: boolean

concurrency:
  group: inner-platform-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write
  id-token: write

jobs:
  preflight:
    name: Resolve production deploy target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CI 가 실패했거나 PR 이벤트로 돈 CI 는 배포 대상이 아니다.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      sha: ${{ steps.resolve.outputs.sha }}
      promote: ${{ steps.resolve.outputs.promote }}
    steps:
      - name: Resolve deploy target
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_PROMOTE: ${{ inputs.promote_alias }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${DISPATCH_REF}" != "refs/heads/main" ]; then
              echo "Production deploys must be dispatched from refs/heads/main. Current ref: ${DISPATCH_REF}" >&2
              exit 1
            fi
            sha="${DISPATCH_SHA}"
            promote="${DISPATCH_PROMOTE}"
          else
            sha="${CI_SHA}"
            promote=true
          fi
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${sha}" != "${head}" ]; then
            if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "main advanced to ${head} after dispatch; dispatch the current main commit instead." >&2
              exit 1
            fi
            # 자동 트리거는 뒤처진 커밋을 조용히 건너뛴다. 최신 커밋의 CI 가 자기 배포를 띄운다.
            echo "main advanced to ${head}; skipping superseded ${sha}."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "Deploy target ${sha} (promote_alias=${promote})"
          {
            echo "proceed=true"
            echo "sha=${sha}"
            echo "promote=${promote}"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy production from main
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
      url: https://myscube.myscguard.app
    env:
      VERCEL_CANONICAL_PRODUCTION_HOST: myscube.myscguard.app
      VERCEL_CLI_PACKAGE: vercel@50.14.0
      VERCEL_DEPLOY_ALLOWED_AUTHOR_EMAILS: ai@mysc.co.kr
      DEPLOY_INVOCATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      LIVE_FIREBASE_PROJECT_ID: inner-platform-live-20260316
      BFF_DEPLOY_ENV: live
      BFF_AUTH_MODE: firebase_required
      BFF_EDIT_LEASES_ENABLED: 'true'
      BFF_WORKERS_ENABLED: 'true'
      BFF_SCHEDULER_OWNER: vercel
      BFF_MAINTENANCE_READ_ONLY: 'false'
      BFF_ALLOWED_ORIGINS: https://myscube.myscguard.app
      JVM_WEEKLY_AUTH_MODE: strict
      JVM_WEEKLY_FIRESTORE_PROJECT_ID: inner-platform-live-20260316
      JVM_WEEKLY_API_BASE_URL: ${{ vars.JVM_WEEKLY_API_BASE_URL_LIVE }}
      JVM_WEEKLY_API_ID_TOKEN_AUDIENCE: ${{ vars.JVM_WEEKLY_API_ID_TOKEN_AUDIENCE_LIVE }}
      JVM_SOURCE_PATHS: server/jvm-weekly-api
      JVM_PROJECT_ID: inner-platform-live-20260316
      JVM_REGION: us-central1
      JVM_SERVICE: innerplatform-jvm-weekly-api-live
      JVM_IMAGE: asia-northeast3-docker.pkg.dev/inner-platform-live-20260316/jvm-images/innerplatform-jvm-weekly-api-live
      SLACK_ALERT_CHANNEL_ID: C0BQ6980HR6

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - name: Verify checked out deploy target
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}" || {
            echo "Checked out $(git rev-parse HEAD) but the resolved target is ${DEPLOY_SHA}." >&2
            exit 1
          }

      # 자동 트리거에서는 사실상 자명하지만, 수동 dispatch 와 같은 가드를 통과해야 배포한다.
      - name: Verify CI succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${DEPLOY_SHA}" \
            -f branch=main \
            -f event=push \
            -f per_page=20)"
          jq -e --arg sha "${DEPLOY_SHA}" '
            [.workflow_runs[]
              | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")]
            | length > 0
          ' <<< "${runs}" >/dev/null || {
            echo "CI must be green for ${DEPLOY_SHA} before production deploy." >&2
            exit 1
          }

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deployment verification dependencies
        run: npm ci --ignore-scripts

      - name: Classify Production release mode
        id: release_mode
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          BFF_SPLIT_RELEASE_BASE_SHA: ${{ vars.BFF_SPLIT_RELEASE_BASE_SHA_LIVE }}
        run: |
          set -euo pipefail
          bff_identity="$(node scripts/verify-vercel-deployment-identity.mjs \
            --alias-host "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
            --legacy-missing-invocation-sha "${BFF_SPLIT_RELEASE_BASE_SHA}" \
            --ancestor-of "${DEPLOY_SHA}")"
          bff_deployed_sha="$(jq -er '
            .commitSha
            | select(type == "string" and test("^[0-9a-f]{40}$"))
          ' <<< "${bff_identity}")"
          [[ "${bff_deployed_sha}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${bff_deployed_sha}^{commit}"
          git merge-base --is-ancestor "${bff_deployed_sha}" "${DEPLOY_SHA}"
          BFF_DEPLOY_BASE_SHA="${bff_deployed_sha}"

          release_classification="$(node --input-type=module - "${BFF_DEPLOY_BASE_SHA}" "${DEPLOY_SHA}" <<'NODE'
          import {
            changedPathsBetween,
            classifyCashflowSettlementProductionRelease,
            isJvmRolloutSupportLiveAt,
          } from './scripts/verify-cashflow-settlement-release-boundary.mjs';

          const [aliasBase, head] = process.argv.slice(2);
          const changedPaths = changedPathsBetween(aliasBase, head);
          const { releaseMode, bffFrontendCutover } = classifyCashflowSettlementProductionRelease(
            changedPaths,
            {
              rolloutSupportIsLive: isJvmRolloutSupportLiveAt(head),
              alreadyDeployed: aliasBase === head,
            },
          );
          process.stdout.write(JSON.stringify({
            releaseMode,
            settlementCutover: releaseMode === 'web' && bffFrontendCutover.length > 0,
          }));
          NODE
          )"
          release_mode="$(jq -er '.releaseMode | select(. == "jvm_only" or . == "web" or . == "atomic_cutover" or . == "already_deployed")' \
            <<< "${release_classification}")"
          settlement_cutover="$(jq -er '
            .settlementCutover
            | if . == true then "true"
              elif . == false then "false"
              else error("invalid settlement cutover flag")
              end
          ' <<< "${release_classification}")"
          case "${release_mode}" in
            jvm_only|web|atomic_cutover|already_deployed) ;;
            *) echo "Unexpected production release mode: ${release_mode}" >&2; exit 1 ;;
          esac
          {
            echo "bff_deployed_sha=${bff_deployed_sha}"
            echo "release_mode=${release_mode}"
            echo "settlement_cutover=${settlement_cutover}"
          } >> "${GITHUB_OUTPUT}"

      - name: Skip Production for JVM-only release
        if: steps.release_mode.outputs.release_mode == 'jvm_only'
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          echo "JVM-only release; Vercel production intentionally skipped."
          {
            printf '%s\n' "## InnerPlatform production deploy"
            printf '\n'
            printf '%s\n' "- Result: JVM-only release; Vercel production intentionally skipped."
            printf '%s\n' "- Commit: ${DEPLOY_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Skip Production for atomic settlement cutover
        if: steps.release_mode.outputs.release_mode == 'atomic_cutover'
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          echo "Atomic settlement cutover is owned by JVM Production Deploy."
          echo "- Commit: ${DEPLOY_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Skip Production already completed by atomic owner
        if: steps.release_mode.outputs.release_mode == 'already_deployed'
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: echo "Production alias already points to ${DEPLOY_SHA}; no duplicate deploy."

      - name: Authenticate JVM release verifier
        if: steps.release_mode.outputs.settlement_cutover == 'true'
        uses: google-github-actions/auth@v3
        id: jvm_release_verifier_auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_LIVE }}
          service_account: ${{ vars.GCP_JVM_RELEASE_VERIFIER_SERVICE_ACCOUNT_LIVE }}
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: false

      - name: Set up gcloud for release verification
        if: steps.release_mode.outputs.settlement_cutover == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify cashflow settlement split-release boundary
        id: release_boundary
        if: steps.release_mode.outputs.settlement_cutover == 'true'
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          JVM_SPLIT_RELEASE_BASE_SHA: ${{ vars.JVM_SPLIT_RELEASE_BASE_SHA_LIVE }}
          BFF_DEPLOY_BASE_SHA: ${{ steps.release_mode.outputs.bff_deployed_sha }}
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.jvm_release_verifier_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          normalize_live_image_digest() {
            local image_uri="$1"
            local expected_repository="$2"
            local digest="${image_uri##*@}"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            test "${image_uri}" = "${expected_repository}@${digest}" || return 1
            printf '%s\n' "${digest}"
          }
          service_json="$(gcloud run services describe "${JVM_SERVICE}" \
            --project "${JVM_PROJECT_ID}" --region "${JVM_REGION}" --format=json)"
          positive_revision_count="$(jq -r \
            '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | unique | length' \
            <<< "${service_json}")"
          total_percent="$(jq -r '[.status.traffic[] | (.percent // 0)] | add // 0' <<< "${service_json}")"
          live_revision="$(jq -r '
            [.status.traffic
              | group_by(.revisionName)[]
              | { revision: .[0].revisionName, percent: (map(.percent // 0) | add) }
              | select(.percent == 100)
              | .revision][0] // ""
          ' <<< "${service_json}")"
          test "${positive_revision_count}" = "1"
          test "${total_percent}" = "100"
          test -n "${live_revision}"
          revision_json="$(gcloud run revisions describe "${live_revision}" \
            --project "${JVM_PROJECT_ID}" --region "${JVM_REGION}" --format=json)"
          live_image_uri="$(jq -er '.status.imageDigest' <<< "${revision_json}")"
          live_digest="$(normalize_live_image_digest "${live_image_uri}" "${JVM_IMAGE}")"
          jvm_deployed_sha="$(jq -r '
            [.spec.containers[0].env[]?
              | select(.name == "JVM_WEEKLY_COMMIT_SHA")
              | .value]
            | unique
            | if length == 1 then .[0] else "" end
          ' <<< "${revision_json}")"
          if [ -z "${jvm_deployed_sha}" ]; then
            [[ "${JVM_SPLIT_RELEASE_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "JVM split-release base must be a full lowercase commit SHA." >&2
              exit 1
            }
            bootstrap_digest="$(gcloud artifacts docker images describe \
              "${JVM_IMAGE}:${JVM_SPLIT_RELEASE_BASE_SHA}" \
              --format='value(image_summary.digest)')"
            [[ "${bootstrap_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "JVM split-release base image returned a malformed digest." >&2
              exit 1
            }
            test "${bootstrap_digest}" = "${live_digest}"
            jvm_deployed_sha="${JVM_SPLIT_RELEASE_BASE_SHA}"
          fi
          [[ "${jvm_deployed_sha}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${jvm_deployed_sha}^{commit}"
          git merge-base --is-ancestor "${jvm_deployed_sha}" "${DEPLOY_SHA}"
          JVM_DEPLOY_BASE_SHA="${jvm_deployed_sha}"
          boundary_json="$(node scripts/verify-cashflow-settlement-release-boundary.mjs \
            --jvm-base "${JVM_DEPLOY_BASE_SHA}" \
            --bff-base "${BFF_DEPLOY_BASE_SHA}" \
            --head "${DEPLOY_SHA}")"
          jq -e '.ok == true' <<< "${boundary_json}" >/dev/null
          echo "jvm_deployed_sha=${jvm_deployed_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify Vercel deploy author policy
        if: steps.release_mode.outputs.release_mode == 'web'
        run: |
          set -euo pipefail
          author_email="$(git show -s --format=%ae HEAD)"
          case ",${VERCEL_DEPLOY_ALLOWED_AUTHOR_EMAILS}," in
            *",${author_email},"*) ;;
            *)
              echo "Commit author ${author_email} is not allowed for Vercel production deploys." >&2
              echo "Create a no-op release commit authored by one of: ${VERCEL_DEPLOY_ALLOWED_AUTHOR_EMAILS}" >&2
              exit 1
              ;;
          esac

      - name: Verify Vercel credentials are configured
        if: steps.release_mode.outputs.release_mode == 'web'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
          JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON: ${{ secrets.JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON_LIVE }}
          SLACK_ALERT_BOT_TOKEN: ${{ secrets.SLACK_ALERT_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN}" || { echo "Missing secret: VERCEL_DEPLOY_TOKEN_PRODUCTION" >&2; exit 1; }
          test -n "${VERCEL_ORG_ID}" || { echo "Missing secret: VERCEL_ORG_ID" >&2; exit 1; }
          test -n "${VERCEL_PROJECT_ID}" || { echo "Missing secret: VERCEL_PROJECT_ID" >&2; exit 1; }
          test -n "${VERCEL_AUTOMATION_BYPASS_SECRET}" || { echo "Missing secret: VERCEL_AUTOMATION_BYPASS_SECRET" >&2; exit 1; }
          test -n "${JVM_WEEKLY_API_BASE_URL}" || { echo "Missing Production variable: JVM_WEEKLY_API_BASE_URL_LIVE" >&2; exit 1; }
          test -n "${JVM_WEEKLY_API_ID_TOKEN_AUDIENCE}" || { echo "Missing Production variable: JVM_WEEKLY_API_ID_TOKEN_AUDIENCE_LIVE" >&2; exit 1; }
          test -n "${JVM_WEEKLY_INTERNAL_API_TOKEN}" || { echo "Missing Production secret: JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE" >&2; exit 1; }
          test -n "${JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON}" || { echo "Missing Production secret: JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON_LIVE" >&2; exit 1; }
          test -n "${SLACK_ALERT_BOT_TOKEN}" || { echo "Missing Production secret: SLACK_ALERT_BOT_TOKEN" >&2; exit 1; }
          npx --yes "${VERCEL_CLI_PACKAGE}" whoami --token "${VERCEL_TOKEN}" --scope merryai-devs-projects >/dev/null

      - name: Verify deployed JVM settlement capability and version
        if: steps.release_mode.outputs.settlement_cutover == 'true'
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          JVM_DEPLOYED_SHA: ${{ steps.release_boundary.outputs.jvm_deployed_sha }}
          JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON: ${{ secrets.JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON_LIVE }}
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.jvm_release_verifier_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "${JVM_DEPLOYED_SHA}" || {
            echo "No successful JVM deployment is recorded for the settlement cutover." >&2
            exit 1
          }
          git merge-base --is-ancestor "${JVM_DEPLOYED_SHA}" "${DEPLOY_SHA}"
          git diff --quiet "${JVM_DEPLOYED_SHA}" "${DEPLOY_SHA}" -- ${JVM_SOURCE_PATHS} || {
            echo "The live JVM deployment does not contain the JVM sources required by ${DEPLOY_SHA}." >&2
            exit 1
          }
          service_json="$(gcloud run services describe "${JVM_SERVICE}" \
            --project "${JVM_PROJECT_ID}" --region "${JVM_REGION}" --format=json)"
          positive_revision_count="$(jq -r \
            '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | unique | length' \
            <<< "${service_json}")"
          total_percent="$(jq -r '[.status.traffic[] | (.percent // 0)] | add // 0' <<< "${service_json}")"
          live_revision="$(jq -r '
            [.status.traffic
              | group_by(.revisionName)[]
              | { revision: .[0].revisionName, percent: (map(.percent // 0) | add) }
              | select(.percent == 100)
              | .revision][0] // ""
          ' <<< "${service_json}")"
          live_service_url="$(jq -er '.status.url' <<< "${service_json}")"
          test "${positive_revision_count}" = "1"
          test "${total_percent}" = "100"
          test -n "${live_revision}"
          revision_json="$(gcloud run revisions describe "${live_revision}" \
            --project "${JVM_PROJECT_ID}" --region "${JVM_REGION}" --format=json)"
          live_sha="$(jq -er '
            [.spec.containers[0].env[]
              | select(.name == "JVM_WEEKLY_COMMIT_SHA")
              | .value]
            | unique
            | if length == 1 then .[0] else error("missing or ambiguous commit SHA") end
          ' <<< "${revision_json}")"
          test "${live_sha}" = "${JVM_DEPLOYED_SHA}"
          test "${JVM_WEEKLY_API_BASE_URL%/}" = "${live_service_url}"
          test "${JVM_WEEKLY_API_ID_TOKEN_AUDIENCE%/}" = "${live_service_url}"
          node --input-type=module <<'NODE'
          import { GoogleAuth } from 'google-auth-library';

          const baseUrl = new URL(process.env.JVM_WEEKLY_API_BASE_URL);
          const audience = new URL(process.env.JVM_WEEKLY_API_ID_TOKEN_AUDIENCE);
          if (baseUrl.protocol !== 'https:' || baseUrl.pathname !== '/'
            || audience.protocol !== 'https:' || audience.pathname !== '/'
            || baseUrl.origin !== audience.origin) {
            throw new Error('JVM live origins must be exact HTTPS origins.');
          }
          const credentials = JSON.parse(process.env.JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON);
          const client = await new GoogleAuth({ credentials }).getIdTokenClient(audience.origin);
          const idToken = await client.idTokenProvider.fetchIdToken(audience.origin);
          const response = await fetch(`${baseUrl.origin}/api/v1/health`, {
            headers: { authorization: `Bearer ${idToken}` },
            signal: AbortSignal.timeout(10_000),
          });
          const body = await response.json().catch(() => null);
          if (!response.ok || body?.service !== 'jvm-weekly-api'
            || !Array.isArray(body?.capabilities)
            || !body.capabilities.includes('settlement-cycle-v1')) {
            throw new Error(`Live JVM settlement capability check failed with HTTP ${response.status}.`);
          }
          NODE

      - name: Mint JVM cutover verifier ID token
        id: jvm_cutover_verifier_auth
        if: steps.release_mode.outputs.settlement_cutover == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_LIVE }}
          service_account: ${{ vars.GCP_JVM_RELEASE_VERIFIER_SERVICE_ACCOUNT_LIVE }}
          token_format: id_token
          id_token_audience: ${{ vars.JVM_WEEKLY_API_ID_TOKEN_AUDIENCE_LIVE }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify settlement-cycle cutover inventory
        if: steps.release_mode.outputs.settlement_cutover == 'true'
        env:
          CASHFLOW_ACTOR_UID: ${{ vars.JVM_SETTLEMENT_CANARY_ACTOR_UID_LIVE }}
          JVM_WEEKLY_API_ID_TOKEN: ${{ steps.jvm_cutover_verifier_auth.outputs.id_token }}
          JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.jvm_release_verifier_auth.outputs.credentials_file_path }}
          SETTLEMENT_NORMALIZATION_PROJECTS: p1773817948751,p1775209262483,p1780662870530
        run: |
          set -euo pipefail
          test -n "${CASHFLOW_ACTOR_UID}"
          test -n "${JVM_WEEKLY_API_ID_TOKEN}"
          test -n "${JVM_WEEKLY_INTERNAL_API_TOKEN}"
          test -n "${GOOGLE_APPLICATION_CREDENTIALS}"
          test "${JVM_WEEKLY_API_BASE_URL%/}" = "${JVM_WEEKLY_API_ID_TOKEN_AUDIENCE%/}"
          node scripts/audit-cashflow-settlement-cycle-rollout.mjs \
            --firebase-project "${LIVE_FIREBASE_PROJECT_ID}" \
            --tenant mysc \
            --verify-cutover \
            --normalize-projects "${SETTLEMENT_NORMALIZATION_PROJECTS}" \
            --people-uid "${CASHFLOW_ACTOR_UID}" \
            --jvm-base-url "${JVM_WEEKLY_API_BASE_URL}" \
            --jvm-audience "${JVM_WEEKLY_API_ID_TOKEN_AUDIENCE}"

      - name: Deploy to Vercel production
        id: vercel_deploy
        if: steps.release_mode.outputs.release_mode == 'web'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
          JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON: ${{ secrets.JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON_LIVE }}
          SLACK_ALERT_BOT_TOKEN: ${{ secrets.SLACK_ALERT_BOT_TOKEN }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          deployment="$(node scripts/deploy-vercel-production-candidate.mjs \
            --source-dir . \
            --commit-sha "${commit_sha}" \
            --invocation "${DEPLOY_INVOCATION_ID}" \
            --maintenance false)"
          deployment_url="$(jq -er .deploymentUrl <<< "${deployment}")"
          deployment_host="$(jq -er .deploymentHost <<< "${deployment}")"
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "deployment_host=${deployment_host}" >> "${GITHUB_OUTPUT}"

      - name: Verify Vercel candidate identity
        id: candidate_identity
        if: steps.release_mode.outputs.release_mode == 'web'
        env:
          DEPLOYMENT_HOST: ${{ steps.vercel_deploy.outputs.deployment_host }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          candidate_identity="$(node scripts/verify-vercel-deployment-identity.mjs \
            --host "${DEPLOYMENT_HOST}" \
            --expected-sha "${DEPLOY_SHA}" \
            --expected-invocation "${DEPLOY_INVOCATION_ID}" \
            --ancestor-of "${DEPLOY_SHA}")"
          deployment_id="$(jq -er '.id | select(type == "string" and length > 0)' \
            <<< "${candidate_identity}")"
          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"

      - name: Verify production surface before alias
        if: steps.release_mode.outputs.release_mode == 'web'
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.DEPLOYMENT_URL;
          const expectedProject = process.env.LIVE_FIREBASE_PROJECT_ID;
          const request = async (path, init) => {
            const response = await fetch(`${base}${path}`, {
              ...init,
              redirect: 'error',
              headers: {
                ...init?.headers,
                'x-vercel-protection-bypass': process.env.VERCEL_AUTOMATION_BYPASS_SECRET,
              },
            });
            const body = await response.json().catch(() => ({}));
            return { response, body };
          };

          const health = await request('/api/v1/health');
          if (health.response.status !== 200
            || health.body.projectId !== expectedProject
            || health.body.authMode !== 'firebase_required'
            || health.body.firestoreEmulator !== false) {
            throw new Error(`unsafe production health: ${health.response.status} ${JSON.stringify(health.body)}`);
          }

          const metadata = await request('/.well-known/oauth-protected-resource');
          if (metadata.response.status !== 200 || metadata.body.resource !== 'https://myscube.myscguard.app/mcp') {
            throw new Error(`MCP OAuth discovery is unavailable: ${metadata.response.status} ${JSON.stringify(metadata.body)}`);
          }

          const mcp = await request('/mcp', { method: 'POST', body: '{}' });
          if (mcp.response.status !== 401 || !String(mcp.response.headers.get('www-authenticate') || '').includes('resource_metadata=')) {
            throw new Error(`MCP bearer challenge is unavailable: ${mcp.response.status}`);
          }

          const mutation = await request('/api/v1/__maintenance_probe__', { method: 'POST' });
          if (mutation.response.status !== 400 || mutation.body.error === 'maintenance_read_only') {
            throw new Error(`production maintenance guard still active: ${mutation.response.status} ${JSON.stringify(mutation.body)}`);
          }

          // Workers run from Vercel cron. An unauthenticated call must be rejected as
          // unauthorized, which also proves CRON_SECRET reached the deployment: a missing
          // secret would answer 503 worker_secret_missing instead.
          for (const path of [
            '/api/internal/workers/outbox/run',
            '/api/internal/workers/work-queue/run',
            '/api/internal/workers/payroll/run',
            '/api/internal/workers/client-errors/run',
          ]) {
            const worker = await request(path);
            if (worker.response.status !== 401 || worker.body.error !== 'unauthorized_worker') {
              throw new Error(`worker guard missing at ${path}: ${worker.response.status} ${JSON.stringify(worker.body)}`);
            }
          }
          NODE

      - name: Verify authenticated settlement reads before alias
        if: steps.release_mode.outputs.settlement_cutover == 'true'
        env:
          SETTLEMENT_CANARY_BASE_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
          SETTLEMENT_CANARY_FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY_LIVE }}
          SETTLEMENT_CANARY_FIREBASE_REFRESH_TOKEN: ${{ secrets.FIREBASE_SETTLEMENT_READ_CANARY_REFRESH_TOKEN_LIVE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SETTLEMENT_CANARY_ACTOR_UID: ${{ vars.SETTLEMENT_READ_CANARY_ACTOR_UID_LIVE }}
          SETTLEMENT_CANARY_PROJECT_ID: ${{ vars.JVM_SETTLEMENT_CANARY_PROJECT_ID_LIVE }}
          SETTLEMENT_CANARY_CYCLE_YEAR_MONTH: ${{ vars.JVM_SETTLEMENT_CANARY_CYCLE_YEAR_MONTH_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_REQUEST_ID: ${{ vars.SETTLEMENT_CANARY_EXPECTED_REQUEST_ID_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_STATUS: ${{ vars.SETTLEMENT_CANARY_EXPECTED_STATUS_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_WORKFLOW_REVISION: ${{ vars.SETTLEMENT_CANARY_EXPECTED_WORKFLOW_REVISION_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_EVIDENCE_REVISION: ${{ vars.SETTLEMENT_CANARY_EXPECTED_EVIDENCE_REVISION_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_TARGET_YEAR_MONTH: ${{ vars.SETTLEMENT_CANARY_EXPECTED_TARGET_YEAR_MONTH_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_ACTIONS: ${{ vars.SETTLEMENT_CANARY_EXPECTED_ACTIONS_LIVE }}
          SETTLEMENT_CANARY_TENANT_ID: mysc
          SETTLEMENT_CANARY_CANONICAL_ORIGIN: https://myscube.myscguard.app
        run: node scripts/verify-cashflow-settlement-candidate.mjs

      - name: Capture current canonical alias
        id: previous_alias
        if: steps.release_mode.outputs.release_mode == 'web' && needs.preflight.outputs.promote == 'true'
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          BFF_SPLIT_RELEASE_BASE_SHA: ${{ vars.BFF_SPLIT_RELEASE_BASE_SHA_LIVE }}
        run: |
          set -euo pipefail
          deployment_identity="$(node scripts/verify-vercel-deployment-identity.mjs \
            --alias-host "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
            --legacy-missing-invocation-sha "${BFF_SPLIT_RELEASE_BASE_SHA}" \
            --ancestor-of "${DEPLOY_SHA}")"
          deployment_host="$(jq -er '.host | select(type == "string" and length > 0)' \
            <<< "${deployment_identity}")"
          deployment_id="$(jq -er '.id | select(type == "string" and length > 0)' \
            <<< "${deployment_identity}")"
          commit_sha="$(jq -er '.commitSha
            | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            <<< "${deployment_identity}")"
          {
            echo "deployment_host=${deployment_host}"
            echo "deployment_id=${deployment_id}"
            echo "commit_sha=${commit_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Promote canonical production alias
        id: alias_promotion
        if: steps.release_mode.outputs.release_mode == 'web' && needs.preflight.outputs.promote == 'true'
        env:
          DEPLOYMENT_HOST: ${{ steps.vercel_deploy.outputs.deployment_host }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
        run: |
          set -euo pipefail
          npx --yes "${VERCEL_CLI_PACKAGE}" alias set \
            "${DEPLOYMENT_HOST}" \
            "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
            --token "${VERCEL_TOKEN}" \
            --scope merryai-devs-projects

      - name: Verify canonical alias target
        id: canonical_alias
        if: steps.release_mode.outputs.release_mode == 'web' && needs.preflight.outputs.promote == 'true'
        env:
          DEPLOYMENT_HOST: ${{ steps.vercel_deploy.outputs.deployment_host }}
          CANDIDATE_DEPLOYMENT_ID: ${{ steps.candidate_identity.outputs.deployment_id }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if node scripts/verify-vercel-deployment-identity.mjs \
              --alias-host "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
              --expected-host "${DEPLOYMENT_HOST}" \
              --expected-id "${CANDIDATE_DEPLOYMENT_ID}" \
              --expected-sha "${DEPLOY_SHA}" \
              --expected-invocation "${DEPLOY_INVOCATION_ID}" \
              --ancestor-of "${DEPLOY_SHA}" >/dev/null 2>&1; then
              exit 0
            fi
            [ "${attempt}" = "10" ] || sleep 2
          done
          echo "Canonical production alias did not resolve to the verified candidate." >&2
          exit 1

      - name: Reconcile canonical alias or roll back
        if: always() && steps.release_mode.outputs.release_mode == 'web' && needs.preflight.outputs.promote == 'true' && steps.vercel_deploy.outcome == 'success' && steps.previous_alias.outcome == 'success'
        env:
          DEPLOYMENT_HOST: ${{ steps.vercel_deploy.outputs.deployment_host }}
          PREVIOUS_DEPLOYMENT_HOST: ${{ steps.previous_alias.outputs.deployment_host }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous_alias.outputs.deployment_id }}
          PREVIOUS_DEPLOYMENT_SHA: ${{ steps.previous_alias.outputs.commit_sha }}
          CANDIDATE_DEPLOYMENT_ID: ${{ steps.candidate_identity.outputs.deployment_id }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          BFF_SPLIT_RELEASE_BASE_SHA: ${{ vars.BFF_SPLIT_RELEASE_BASE_SHA_LIVE }}
        run: |
          set -euo pipefail
          if node scripts/verify-vercel-deployment-identity.mjs \
            --alias-host "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
            --expected-host "${DEPLOYMENT_HOST}" \
            --expected-id "${CANDIDATE_DEPLOYMENT_ID}" \
            --expected-sha "${DEPLOY_SHA}" \
            --expected-invocation "${DEPLOY_INVOCATION_ID}" \
            --ancestor-of "${DEPLOY_SHA}" >/dev/null 2>&1; then
            exit 0
          fi

          test -n "${PREVIOUS_DEPLOYMENT_HOST}" || {
            echo "Alias promotion failed and no previous deployment was captured." >&2
            exit 1
          }
          node scripts/verify-vercel-deployment-identity.mjs \
            --host "${PREVIOUS_DEPLOYMENT_HOST}" \
            --expected-id "${PREVIOUS_DEPLOYMENT_ID}" \
            --expected-sha "${PREVIOUS_DEPLOYMENT_SHA}" \
            --legacy-missing-invocation-sha "${BFF_SPLIT_RELEASE_BASE_SHA}" \
            --ancestor-of "${DEPLOY_SHA}" >/dev/null
          rollback_alias_status=0
          npx --yes "${VERCEL_CLI_PACKAGE}" alias set \
            "${PREVIOUS_DEPLOYMENT_HOST}" \
            "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
            --token "${VERCEL_TOKEN}" \
            --scope merryai-devs-projects || rollback_alias_status=$?
          restored=false
          for attempt in {1..10}; do
            if node scripts/verify-vercel-deployment-identity.mjs \
              --alias-host "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
              --expected-host "${PREVIOUS_DEPLOYMENT_HOST}" \
              --expected-id "${PREVIOUS_DEPLOYMENT_ID}" \
              --expected-sha "${PREVIOUS_DEPLOYMENT_SHA}" \
              --legacy-missing-invocation-sha "${BFF_SPLIT_RELEASE_BASE_SHA}" \
              --ancestor-of "${DEPLOY_SHA}" >/dev/null 2>&1; then
              restored=true
              break
            fi
            [ "${attempt}" = "10" ] || sleep 2
          done
          test "${restored}" = "true"
          if [ "${rollback_alias_status}" != "0" ]; then
            echo "Alias rollback command lost its response, but the restored target and authenticated read were verified." >&2
          fi
          exit 1

      - name: Release summary
        if: steps.release_mode.outputs.release_mode == 'web'
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
        run: |
          {
            printf '%s\n' "## InnerPlatform production deploy"
            printf '\n'
            printf '%s\n' "- Canonical URL: https://myscube.myscguard.app"
            printf '%s\n' "- Deployment URL: ${DEPLOYMENT_URL}"
            printf '%s\n' "- Commit: $(git rev-parse HEAD)"
            printf '%s\n' "- Branch: main"
            printf '%s\n' "- Actor: ${GITHUB_ACTOR}"
          } >> "${GITHUB_STEP_SUMMARY}"
