name: JVM Production Deploy

on:
  # main 의 CI 가 초록이고 JVM 소스가 실제로 바뀐 커밋일 때만 자동 배포한다.
  # 매 커밋마다 Cloud Run 리비전을 새로 올리면 바뀐 것 없는 배포가 쌓이고,
  # --min-instances 1 롤아웃 위험만 반복된다.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even when JVM sources did not change
        required: false
        default: false
        type: boolean
      resume_candidate_revision:
        description: Resume the exact zero-traffic candidate for the current main SHA
        required: false
        type: string

concurrency:
  group: inner-platform-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

env:
  JVM_SOURCE_PATHS: server/jvm-weekly-api scripts/cashflow-settlement-legacy-parity.jq scripts/verify-cashflow-settlement-cycle-projection.mjs scripts/verify-cashflow-settlement-candidate.mjs .github/workflows/jvm-production-deploy.yml

jobs:
  preflight:
    name: Resolve JVM deploy target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      sha: ${{ steps.resolve.outputs.sha }}
      resume_revision: ${{ steps.resolve.outputs.resume_revision }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve deploy target
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
          RESUME_CANDIDATE_REVISION: ${{ inputs.resume_candidate_revision }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${DISPATCH_REF}" != "refs/heads/main" ]; then
              echo "JVM production deploys must be dispatched from refs/heads/main. Current ref: ${DISPATCH_REF}" >&2
              exit 1
            fi
            sha="${DISPATCH_SHA}"
          else
            sha="${CI_SHA}"
          fi
          head="$(git rev-parse origin/main)"
          if [ "${sha}" != "${head}" ]; then
            if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "main advanced to ${head} after dispatch; dispatch the current main commit instead." >&2
              exit 1
            fi
            echo "main advanced to ${head}; skipping superseded ${sha}."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          resume_revision="${RESUME_CANDIDATE_REVISION:-}"
          if [ -n "${resume_revision}" ]; then
            if [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
              echo "A candidate can only be resumed through the exceptional manual path." >&2
              exit 1
            fi
            if [[ ! "${resume_revision}" =~ ^innerplatform-jvm-weekly-api-live-hotfix-[0-9a-f]{8}$ ]]; then
              echo "Candidate ${resume_revision} is not an exact JVM production revision." >&2
              exit 1
            fi
            {
              echo "proceed=true"
              echo "sha=${sha}"
              echo "resume_revision=${resume_revision}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${FORCE}" = "true" ]; then
            echo "Forced deploy of ${sha}."
            printf 'proceed=true\nsha=%s\nresume_revision=\n' "${sha}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # 워크플로 자체가 success 여도 deploy job 은 skip 일 수 있다. 실제 deploy job 이
          # 성공한 마지막 SHA 만 배포 기준으로 인정한다.
          runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/jvm-production-deploy.yml/runs" \
            -f status=success -f branch=main -f per_page=100)"
          last=""
          while IFS=$'\t' read -r run_id run_sha; do
            [ -n "${run_id}" ] || continue
            jobs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" -f per_page=100)"
            if jq -e '.jobs[]
                | select(.name == "Deploy JVM candidate and promote" and .conclusion == "success")
                | .steps[]
                | select((.name == "Reconcile promotion traffic or roll back"
                    or .name == "Verify canonical service after promotion")
                  and .conclusion == "success")' \
              <<< "${jobs}" >/dev/null; then
              last="${run_sha}"
              break
            fi
          done < <(jq -r '.workflow_runs[] | [.id, .head_sha] | @tsv' <<< "${runs}")
          if [ -z "${last}" ] || ! git cat-file -e "${last}^{commit}" 2>/dev/null; then
            echo "No usable previous successful JVM deploy; deploying ${sha}."
          elif git diff --quiet "${last}" "${sha}" -- ${JVM_SOURCE_PATHS}; then
            echo "No JVM source change between ${last} and ${sha}; skipping."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          else
            echo "JVM sources changed since ${last}:"
            git diff --name-only "${last}" "${sha}" -- ${JVM_SOURCE_PATHS}
          fi
          printf 'proceed=true\nsha=%s\nresume_revision=\n' "${sha}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy JVM candidate and promote
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      PROJECT_ID: inner-platform-live-20260316
      # Firestore (default) 는 nam5(미국) 에 있다. JVM 은 요청당 Firestore 왕복 7회가 전부라
      # 데이터 옆(us-central1) 에 둔다. 서울(asia-northeast3) 에선 왕복마다 ~200ms 였다.
      # 이미지 레지스트리는 그대로 서울에 둔다(리전 간 pull 은 배포 시간에만 영향).
      REGION: us-central1
      SERVICE: innerplatform-jvm-weekly-api-live
      # 새 리전의 서비스는 IAM 이 비어 있다. 배포자(run.developer)는 setIamPolicy 권한이 없으므로
      # 첫 배포 뒤 아래 두 계정에 roles/run.invoker 를 사람이 한 번 붙여야 검증·BFF 호출이 통과한다:
      #   myscube-live-bff-invoker@inner-platform-live-20260316.iam.gserviceaccount.com
      #   github-jvm-deployer@inner-platform-live-20260316.iam.gserviceaccount.com
      RUNTIME_SERVICE_ACCOUNT: innerplatform-jvm-runtime@inner-platform-live-20260316.iam.gserviceaccount.com
      IMAGE: asia-northeast3-docker.pkg.dev/inner-platform-live-20260316/jvm-images/innerplatform-jvm-weekly-api-live
      VERCEL_CANONICAL_PRODUCTION_HOST: myscube.myscguard.app
      VERCEL_CLI_PACKAGE: vercel@50.14.0
      DEPLOY_INVOCATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      LIVE_FIREBASE_PROJECT_ID: inner-platform-live-20260316
      BFF_DEPLOY_ENV: live
      BFF_AUTH_MODE: firebase_required
      BFF_EDIT_LEASES_ENABLED: 'true'
      BFF_ALLOWED_ORIGINS: https://myscube.myscguard.app
      JVM_WEEKLY_FIRESTORE_PROJECT_ID: inner-platform-live-20260316
      JVM_WEEKLY_AUTH_MODE: strict
      SLACK_ALERT_CHANNEL_ID: C0BQ6980HR6
      DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
      CASHFLOW_PROJECT_ID: ${{ vars.JVM_SETTLEMENT_CANARY_PROJECT_ID_LIVE }}
      CASHFLOW_YEAR_MONTH: ${{ vars.JVM_SETTLEMENT_CANARY_CYCLE_YEAR_MONTH_LIVE }}
      CASHFLOW_ACTOR_UID: ${{ vars.JVM_SETTLEMENT_CANARY_ACTOR_UID_LIVE }}
      RESUME_CANDIDATE_REVISION: ${{ needs.preflight.outputs.resume_revision }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - name: Configure cutover working files
        run: |
          echo "CUTOVER_STATE_FILE=${RUNNER_TEMP}/cashflow-settlement-cutover-state.json" >> "${GITHUB_ENV}"
          echo "CUTOVER_PREFLIGHT_REPORT=${RUNNER_TEMP}/cashflow-settlement-preflight-report.json" >> "${GITHUB_ENV}"
          echo "CUTOVER_PRE_MAINTENANCE_REPORT=${RUNNER_TEMP}/cashflow-settlement-pre-maintenance-report.json" >> "${GITHUB_ENV}"
          echo "CUTOVER_POST_DRAIN_REPORT=${RUNNER_TEMP}/cashflow-settlement-post-drain-report.json" >> "${GITHUB_ENV}"
          echo "CUTOVER_PLAN_FILE=${RUNNER_TEMP}/cashflow-settlement-cutover-plan.json" >> "${GITHUB_ENV}"
          echo "PROTECTED_SNAPSHOT_FILE=${RUNNER_TEMP}/cashflow-settlement-protected.json" >> "${GITHUB_ENV}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify checked out deploy target
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"

      - name: Verify CI succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${DEPLOY_SHA}" -f branch=main -f event=push -f per_page=20)"
          jq -e --arg sha "${DEPLOY_SHA}" '
            [.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")]
            | length > 0
          ' <<< "${runs}" >/dev/null

      - name: Install rollout audit dependencies
        run: npm ci --ignore-scripts

      # gcloud 자격증명만. 서비스 호출용 ID 토큰은 배포 뒤 서비스 URL 을 audience 로 따로 발급한다.
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_LIVE }}
          service_account: ${{ vars.GCP_JVM_DEPLOYER_SERVICE_ACCOUNT_LIVE }}
          export_environment_variables: false

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify cashflow settlement split-release boundary
        id: release_boundary
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          JVM_SPLIT_RELEASE_BASE_SHA: ${{ vars.JVM_SPLIT_RELEASE_BASE_SHA_LIVE }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          BFF_SPLIT_RELEASE_BASE_SHA: ${{ vars.BFF_SPLIT_RELEASE_BASE_SHA_LIVE }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          normalize_live_image_digest() {
            local image_uri="$1"
            local expected_repository="$2"
            local digest="${image_uri##*@}"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            test "${image_uri}" = "${expected_repository}@${digest}" || return 1
            printf '%s\n' "${digest}"
          }
          service_json="$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
          positive_revision_count="$(jq -r \
            '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | unique | length' \
            <<< "${service_json}")"
          total_percent="$(jq -r '[.status.traffic[] | (.percent // 0)] | add // 0' <<< "${service_json}")"
          live_revision="$(jq -r '
            [.status.traffic
              | group_by(.revisionName)[]
              | { revision: .[0].revisionName, percent: (map(.percent // 0) | add) }
              | select(.percent == 100)
              | .revision][0] // ""
          ' <<< "${service_json}")"
          test "${positive_revision_count}" = "1"
          test "${total_percent}" = "100"
          test -n "${live_revision}"
          revision_json="$(gcloud run revisions describe "${live_revision}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
          live_image_uri="$(jq -er '.status.imageDigest' <<< "${revision_json}")"
          live_digest="$(normalize_live_image_digest "${live_image_uri}" "${IMAGE}")"
          jvm_deployed_sha="$(jq -r '
            [.spec.containers[0].env[]?
              | select(.name == "JVM_WEEKLY_COMMIT_SHA")
              | .value]
            | unique
            | if length == 1 then .[0] else "" end
          ' <<< "${revision_json}")"
          if [ -z "${jvm_deployed_sha}" ]; then
            [[ "${JVM_SPLIT_RELEASE_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "JVM split-release base must be a full lowercase commit SHA." >&2
              exit 1
            }
            bootstrap_digest="$(gcloud artifacts docker images describe \
              "${IMAGE}:${JVM_SPLIT_RELEASE_BASE_SHA}" \
              --format='value(image_summary.digest)')"
            [[ "${bootstrap_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "JVM split-release base image returned a malformed digest." >&2
              exit 1
            }
            test "${bootstrap_digest}" = "${live_digest}"
            jvm_deployed_sha="${JVM_SPLIT_RELEASE_BASE_SHA}"
          fi

          bff_identity="$(node scripts/verify-vercel-deployment-identity.mjs \
            --alias-host "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
            --legacy-missing-invocation-sha "${BFF_SPLIT_RELEASE_BASE_SHA}" \
            --ancestor-of "${DEPLOY_SHA}")"
          bff_deployed_sha="$(jq -er '
            .commitSha
            | select(type == "string" and test("^[0-9a-f]{40}$"))
          ' <<< "${bff_identity}")"
          for deployed_sha in "${jvm_deployed_sha}" "${bff_deployed_sha}"; do
            [[ "${deployed_sha}" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${deployed_sha}^{commit}"
            git merge-base --is-ancestor "${deployed_sha}" "${DEPLOY_SHA}"
          done
          JVM_DEPLOY_BASE_SHA="${jvm_deployed_sha}"
          BFF_DEPLOY_BASE_SHA="${bff_deployed_sha}"
          boundary_json="$(node scripts/verify-cashflow-settlement-release-boundary.mjs \
            --jvm-base "${JVM_DEPLOY_BASE_SHA}" \
            --bff-base "${BFF_DEPLOY_BASE_SHA}" \
            --head "${DEPLOY_SHA}")"
          if [ -n "${RESUME_CANDIDATE_REVISION}" ] \
            && [ "${live_revision}" = "${RESUME_CANDIDATE_REVISION}" ] \
            && [ "${live_revision}" = "innerplatform-jvm-weekly-api-live-hotfix-${jvm_deployed_sha::8}" ]; then
            git diff --quiet "${jvm_deployed_sha}" "${DEPLOY_SHA}" -- server/jvm-weekly-api
            jq -e '.releaseMode == "web" and (.bffFrontendCutover | length > 0)' \
              <<< "${boundary_json}" >/dev/null
            release_mode=final_web_resume
          else
            release_mode="$(jq -er \
              '.releaseMode | select(. == "jvm_only" or . == "atomic_cutover")' \
              <<< "${boundary_json}")"
          fi
          {
            echo "release_mode=${release_mode}"
            echo "bff_deployed_sha=${bff_deployed_sha}"
            echo "bff_deployment_host=$(jq -er .host <<< "${bff_identity}")"
            echo "bff_deployment_id=$(jq -er .id <<< "${bff_identity}")"
            echo "bff_deployment_invocation=$(jq -er '.invocation // ""' <<< "${bff_identity}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Block atomic cutover while settlement work is active
        id: settlement_preflight
        if: steps.release_boundary.outputs.release_mode == 'atomic_cutover'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          node scripts/audit-cashflow-settlement-cycle-rollout.mjs \
            --firebase-project "${PROJECT_ID}" \
            --tenant mysc \
            --output "${CUTOVER_PREFLIGHT_REPORT}"
          plan="$(node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
            freeze-preflight "${CUTOVER_PREFLIGHT_REPORT}" "${CUTOVER_PLAN_FILE}")"
          candidates="$(jq -er '.migrationCandidateProjects | join(",")' <<< "${plan}")"
          normalizations="$(jq -er '.normalizationProjects | join(",")' <<< "${plan}")"
          test -n "${candidates}"
          test -n "${normalizations}"
          echo "candidate_projects=${candidates}" >> "${GITHUB_OUTPUT}"
          echo "normalization_projects=${normalizations}" >> "${GITHUB_OUTPUT}"
          {
            echo "- Protected completed MONTH projects: $(jq '.protectedCompletedMonthProjects | length' <<< "${plan}")"
            echo "- Protected settlement status documents: $(jq '.protectedStatusDocumentCount' <<< "${plan}")"
            echo "- Migration candidates: $(jq '.migrationCandidateProjects | length' <<< "${plan}")"
            echo "- Request normalization candidates: $(jq '.normalizationProjects | length' <<< "${plan}")"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Capture current live revision
        id: previous
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
          positive_revision_count="$(jq -r \
            '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | unique | length' \
            <<< "${service_json}")"
          total_percent="$(jq -r '[.status.traffic[] | (.percent // 0)] | add // 0' <<< "${service_json}")"
          revision="$(jq -r '
            [.status.traffic
              | group_by(.revisionName)[]
              | { revision: .[0].revisionName, percent: (map(.percent // 0) | add) }
              | select(.percent == 100)
              | .revision][0] // ""
          ' <<< "${service_json}")"
          test "${positive_revision_count}" = "1"
          test "${total_percent}" = "100"
          test -n "${revision}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "previous live revision: ${revision:-<none>}"

      - name: Build tested image
        id: image
        if: needs.preflight.outputs.resume_revision == ''
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          mvn -f server/jvm-weekly-api/pom.xml test
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
          docker build \
            -f server/jvm-weekly-api/Dockerfile \
            -t "${IMAGE}:${DEPLOY_SHA}" \
            .
          docker push "${IMAGE}:${DEPLOY_SHA}"
          digest="$(gcloud artifacts docker images describe "${IMAGE}:${DEPLOY_SHA}" --format='value(image_summary.digest)')"
          test -n "${digest}"
          echo "uri=${IMAGE}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Deploy candidate without live traffic
        id: candidate
        if: needs.preflight.outputs.resume_revision == ''
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          revision_suffix="hotfix-${DEPLOY_SHA::8}"
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --image "${IMAGE_URI}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --revision-suffix "${revision_suffix}" \
            --labels "myscube-deploy-sha=${DEPLOY_SHA}" \
            --no-traffic \
            --tag candidate \
            --ingress all \
            --min-instances 1 \
            --no-cpu-throttling \
            --liveness-probe 'httpGet.path=/api/v1/health,initialDelaySeconds=30,periodSeconds=30,timeoutSeconds=5,failureThreshold=3' \
            --set-env-vars "^|^WEEKLY_API_PORT=8080|JVM_WEEKLY_DEPLOY_ENV=live|JVM_WEEKLY_COMMIT_SHA=${DEPLOY_SHA}|JVM_WEEKLY_EDIT_LEASES_ENABLED=true|JVM_WEEKLY_INTERNAL_API_TOKEN_ENABLED=true|JVM_WEEKLY_STORAGE_BACKEND=firestore|JVM_WEEKLY_PROJECT_ACCESS_BACKEND=firestore|JVM_WEEKLY_AUTH_MODE=strict|JVM_WEEKLY_WORKSPACE_EMAIL_DOMAIN=mysc.co.kr|JVM_WEEKLY_FIREBASE_PROJECT_ID=inner-platform-live-20260316|JVM_WEEKLY_FIRESTORE_PROJECT_ID=inner-platform-live-20260316|JVM_WEEKLY_FIREBASE_AUTH_PROJECT_ID=inner-platform-live-20260316|JVM_WEEKLY_ALLOWED_ORIGINS=https://myscube.myscguard.app|STATION_REGISTRY_CREDITS_URL=https://getregistrycreditsforcubeiam-7qkpqg2upq-du.a.run.app|STATION_REGISTRY_CREDITS_AUDIENCE=https://getregistrycreditsforcubeiam-7qkpqg2upq-du.a.run.app" \
            --set-secrets 'JVM_WEEKLY_INTERNAL_API_TOKEN=innerplatform-weekly-api-token:latest,JVM_WEEKLY_CASHFLOW_SETTLED_WEEK_CONFIRMATION_KEY=innerplatform-cashflow-settled-week-confirmation-key:latest'
          revision="${SERVICE}-${revision_suffix}"
          candidate_url="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            | jq -r --arg revision "${revision}" '.status.traffic[] | select(.revisionName == $revision and .tag == "candidate") | .url')"
          test -n "${candidate_url}"
          service_url="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          test -n "${service_url}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "url=${candidate_url}" >> "${GITHUB_OUTPUT}"
          echo "service_url=${service_url}" >> "${GITHUB_OUTPUT}"
          echo "service url (BFF JVM_WEEKLY_API_BASE_URL_LIVE / _ID_TOKEN_AUDIENCE_LIVE 는 이 값): ${service_url}"

      - name: Resolve existing candidate
        id: resumed_candidate
        if: needs.preflight.outputs.resume_revision != ''
        env:
          RELEASE_MODE: ${{ steps.release_boundary.outputs.release_mode }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          revision="${RESUME_CANDIDATE_REVISION}"
          service_json="$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json)"
          candidate_url="$(jq -er --arg revision "${revision}" \
            '.status.traffic[] | select(.revisionName == $revision and .tag == "candidate") | .url' \
            <<< "${service_json}")"
          candidate_percent="$(jq -r --arg revision "${revision}" \
            '[.status.traffic[] | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
            <<< "${service_json}")"
          positive_revision_count="$(jq -r \
            '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | unique | length' \
            <<< "${service_json}")"
          total_percent="$(jq -r '[.status.traffic[] | (.percent // 0)] | add // 0' <<< "${service_json}")"
          test "${positive_revision_count}" = "1"
          test "${total_percent}" = "100"
          if [ "${RELEASE_MODE}" = "final_web_resume" ]; then
            test "${candidate_percent}" = "100"
          else
            test "${candidate_percent}" = "0"
          fi
          service_url="$(jq -er '.status.url' <<< "${service_json}")"
          {
            echo "revision=${revision}"
            echo "url=${candidate_url}"
            echo "service_url=${service_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve candidate target
        id: target
        env:
          DEPLOYED_REVISION: ${{ steps.candidate.outputs.revision }}
          DEPLOYED_URL: ${{ steps.candidate.outputs.url }}
          DEPLOYED_SERVICE_URL: ${{ steps.candidate.outputs.service_url }}
          RESUMED_REVISION: ${{ steps.resumed_candidate.outputs.revision }}
          RESUMED_URL: ${{ steps.resumed_candidate.outputs.url }}
          RESUMED_SERVICE_URL: ${{ steps.resumed_candidate.outputs.service_url }}
        run: |
          set -euo pipefail
          revision="${DEPLOYED_REVISION:-${RESUMED_REVISION}}"
          candidate_url="${DEPLOYED_URL:-${RESUMED_URL}}"
          service_url="${DEPLOYED_SERVICE_URL:-${RESUMED_SERVICE_URL}}"
          test -n "${revision}"
          test -n "${candidate_url}"
          test -n "${service_url}"
          {
            echo "revision=${revision}"
            echo "url=${candidate_url}"
            echo "service_url=${service_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify candidate image and commit identity
        if: needs.preflight.outputs.resume_revision == ''
        env:
          REVISION: ${{ steps.target.outputs.revision }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          expected_digest="$(gcloud artifacts docker images describe "${IMAGE}:${DEPLOY_SHA}" \
            --format='value(image_summary.digest)')"
          [[ "${expected_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Candidate image returned a malformed digest." >&2
            exit 1
          }
          revision_json="$(gcloud run revisions describe "${REVISION}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json)"
          actual_image="$(jq -er '.status.imageDigest' <<< "${revision_json}")"
          actual_sha="$(jq -er '
            [.spec.containers[0].env[]
              | select(.name == "JVM_WEEKLY_COMMIT_SHA")
              | .value]
            | unique
            | if length == 1 then .[0] else error("missing or ambiguous commit SHA") end
          ' <<< "${revision_json}")"
          test "${actual_image}" = "${IMAGE}@${expected_digest}"
          test "${actual_sha}" = "${DEPLOY_SHA}"

      # ID 토큰의 audience 는 호출받는 서비스의 URL 이어야 한다. 서비스 URL 은 배포 뒤에야
      # 확정되므로(리전 이동 첫 배포) 여기서 그 URL 로 다시 발급한다.
      - name: Mint ID token for the deployed service
        id: service_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_LIVE }}
          service_account: ${{ vars.GCP_JVM_DEPLOYER_SERVICE_ACCOUNT_LIVE }}
          token_format: id_token
          id_token_audience: ${{ steps.target.outputs.service_url }}
          export_environment_variables: false

      - name: Initialize atomic cutover sequence
        id: cutover_sequence
        if: steps.release_boundary.outputs.release_mode == 'atomic_cutover' || steps.release_boundary.outputs.release_mode == 'final_web_resume'
        env:
          RELEASE_MODE: ${{ steps.release_boundary.outputs.release_mode }}
        run: |
          if [ "${RELEASE_MODE}" = "final_web_resume" ]; then
            node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
              resume-final-web "${CUTOVER_STATE_FILE}"
          else
            node scripts/verify-cashflow-settlement-cutover-sequence.mjs init "${CUTOVER_STATE_FILE}"
          fi

      - name: Verify settlement candidate before migration
        env:
          CANDIDATE_URL: ${{ steps.target.outputs.url }}
          SERVICE_URL: ${{ steps.target.outputs.service_url }}
          ID_TOKEN: ${{ steps.service_auth.outputs.id_token }}
          JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
          RELEASE_MODE: ${{ steps.release_boundary.outputs.release_mode }}
        run: |
          set -euo pipefail
          test -n "${CASHFLOW_PROJECT_ID}"
          test -n "${CASHFLOW_YEAR_MONTH}"
          test -n "${CASHFLOW_ACTOR_UID}"

          read_jvm() {
            local base_url="$1"
            local path="$2"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ID_TOKEN}" \
              -H "x-inner-platform-service-token: ${JVM_WEEKLY_INTERNAL_API_TOKEN}" \
              -H 'x-tenant-id: mysc' \
              -H "x-actor-id: ${CASHFLOW_ACTOR_UID}" \
              -H 'x-actor-role: ADMIN' \
              "${base_url}${path}"
          }

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "${CANDIDATE_URL}/api/v1/health" \
            | jq -e '.ok == true and .service == "jvm-weekly-api" and (.capabilities | index("settlement-cycle-v1") != null)' >/dev/null

          if [ "${RELEASE_MODE}" = "atomic_cutover" ]; then
            legacy_path="/api/v1/cashflow/${CASHFLOW_PROJECT_ID}/month-close/dashboard-source?yearMonth=${CASHFLOW_YEAR_MONTH}"
            live="$(read_jvm "${SERVICE_URL}" "${legacy_path}" | jq -S -c -f scripts/cashflow-settlement-legacy-parity.jq)"
            candidate="$(read_jvm "${CANDIDATE_URL}" "${legacy_path}" | jq -S -c -f scripts/cashflow-settlement-legacy-parity.jq)"
            test "${candidate}" = "${live}"
            node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
              advance "${CUTOVER_STATE_FILE}" candidate_verified
          else
            strict_url="${CANDIDATE_URL}"
            if [ "${RELEASE_MODE}" = "final_web_resume" ]; then
              strict_url="${SERVICE_URL}"
            fi
            candidate_cycle_dashboard="$(read_jvm "${strict_url}" \
              "/api/v1/cashflow/${CASHFLOW_PROJECT_ID}/month-close/dashboard-source?yearMonth=${CASHFLOW_YEAR_MONTH}&settlementCycle=true")"
            node scripts/verify-cashflow-settlement-cycle-projection.mjs \
              "${CASHFLOW_PROJECT_ID}" \
              "${CASHFLOW_YEAR_MONTH}" \
              <<< "${candidate_cycle_dashboard}" >/dev/null
          fi

      - name: Verify Firestore recovery is ready
        if: steps.release_boundary.outputs.release_mode == 'atomic_cutover'
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          backups="$(gcloud firestore backups list \
            --project "${PROJECT_ID}" \
            --location nam5 \
            --format=json)"
          database="$(gcloud firestore databases describe \
            --project "${PROJECT_ID}" \
            --database='(default)' \
            --format=json)"
          recovery_file="${RUNNER_TEMP}/firestore-recovery.json"
          jq -n --argjson backups "${backups}" --argjson database "${database}" \
            '{ backups: $backups, database: $database }' > "${recovery_file}"
          node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
            verify-firestore-recovery "${recovery_file}"

      - name: Recheck frozen inventory before maintenance
        if: steps.release_boundary.outputs.release_mode == 'atomic_cutover'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          node scripts/audit-cashflow-settlement-cycle-rollout.mjs \
            --firebase-project "${PROJECT_ID}" \
            --tenant mysc \
            --output "${CUTOVER_PRE_MAINTENANCE_REPORT}"
          node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
            verify-preflight "${CUTOVER_PLAN_FILE}" "${CUTOVER_PRE_MAINTENANCE_REPORT}"

      - name: Verify current maintenance web for final resume
        if: steps.release_boundary.outputs.release_mode == 'final_web_resume'
        env:
          BFF_DEPLOYED_SHA: ${{ steps.release_boundary.outputs.bff_deployed_sha }}
          BFF_DEPLOYMENT_HOST: ${{ steps.release_boundary.outputs.bff_deployment_host }}
          BFF_DEPLOYMENT_ID: ${{ steps.release_boundary.outputs.bff_deployment_id }}
          BFF_DEPLOYMENT_INVOCATION: ${{ steps.release_boundary.outputs.bff_deployment_invocation }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          test -n "${BFF_DEPLOYMENT_INVOCATION}"
          node scripts/verify-vercel-deployment-identity.mjs \
            --alias-host "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
            --expected-host "${BFF_DEPLOYMENT_HOST}" \
            --expected-id "${BFF_DEPLOYMENT_ID}" \
            --expected-sha "${BFF_DEPLOYED_SHA}" \
            --expected-invocation "${BFF_DEPLOYMENT_INVOCATION}" \
            --ancestor-of "${DEPLOY_SHA}" >/dev/null
          curl --fail --silent --show-error \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "https://${BFF_DEPLOYMENT_HOST}/api/v1/health" >/dev/null
          mutation="$(curl --silent --show-error -X POST \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            -H 'content-type: application/json' -d '{}' -w '\n%{http_code}' \
            "https://${BFF_DEPLOYMENT_HOST}/api/v1/__maintenance_probe__")"
          test "${mutation##*$'\n'}" = "503"
          jq -e '.error == "maintenance_read_only"' <<< "${mutation%$'\n'*}" >/dev/null
          worker="$(curl --silent --show-error -w '\n%{http_code}' \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "https://${BFF_DEPLOYMENT_HOST}/api/internal/workers/outbox/run")"
          test "${worker##*$'\n'}" = "503"
          jq -e '.error == "worker_scheduler_disabled"' <<< "${worker%$'\n'*}" >/dev/null

      - name: Activate current web maintenance alias
        id: maintenance_web
        if: steps.release_boundary.outputs.release_mode == 'atomic_cutover'
        env:
          BFF_DEPLOYED_SHA: ${{ steps.release_boundary.outputs.bff_deployed_sha }}
          CANDIDATE_URL: ${{ steps.target.outputs.url }}
          JVM_WEEKLY_API_ID_TOKEN_AUDIENCE: ${{ steps.target.outputs.service_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
          JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON: ${{ secrets.JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON_LIVE }}
          SLACK_ALERT_BOT_TOKEN: ${{ secrets.SLACK_ALERT_BOT_TOKEN }}
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/cashflow-settlement-b0"
          git worktree add --detach "${source_dir}" "${BFF_DEPLOYED_SHA}"
          deployment="$(JVM_WEEKLY_API_BASE_URL="${CANDIDATE_URL}" \
            node scripts/deploy-vercel-production-candidate.mjs \
              --source-dir "${source_dir}" \
              --commit-sha "${BFF_DEPLOYED_SHA}" \
              --invocation "${DEPLOY_INVOCATION_ID}" \
              --maintenance true)"
          deployment_url="$(jq -er .deploymentUrl <<< "${deployment}")"
          deployment_host="$(jq -er .deploymentHost <<< "${deployment}")"
          identity="$(node scripts/verify-vercel-deployment-identity.mjs \
            --host "${deployment_host}" \
            --expected-sha "${BFF_DEPLOYED_SHA}" \
            --expected-invocation "${DEPLOY_INVOCATION_ID}" \
            --ancestor-of "${DEPLOY_SHA}")"
          deployment_id="$(jq -er .id <<< "${identity}")"

          assert_maintenance() {
            local base_url="$1"
            local bypass_header=()
            if [ -n "${2:-}" ]; then
              bypass_header=(-H "x-vercel-protection-bypass: $2")
            fi
            mutation="$(curl --silent --show-error "${bypass_header[@]}" \
              -X POST -H 'content-type: application/json' -d '{}' \
              -w '\n%{http_code}' "${base_url}/api/v1/__maintenance_probe__")" || return 1
            test "${mutation##*$'\n'}" = "503" || return 1
            jq -e '.error == "maintenance_read_only"' <<< "${mutation%$'\n'*}" >/dev/null || return 1
            worker="$(curl --silent --show-error "${bypass_header[@]}" \
              -w '\n%{http_code}' "${base_url}/api/internal/workers/outbox/run")" || return 1
            test "${worker##*$'\n'}" = "503" || return 1
            jq -e '.error == "worker_scheduler_disabled"' <<< "${worker%$'\n'*}" >/dev/null || return 1
          }
          assert_maintenance "${deployment_url}" "${VERCEL_AUTOMATION_BYPASS_SECRET}"
          npx --yes "${VERCEL_CLI_PACKAGE}" alias set \
            "${deployment_host}" "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
            --token "${VERCEL_TOKEN}" --scope merryai-devs-projects
          alias_ready=false
          for attempt in {1..10}; do
            if node scripts/verify-vercel-deployment-identity.mjs \
                --alias-host "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
                --expected-host "${deployment_host}" \
                --expected-id "${deployment_id}" \
                --expected-sha "${BFF_DEPLOYED_SHA}" \
                --expected-invocation "${DEPLOY_INVOCATION_ID}" \
                --ancestor-of "${DEPLOY_SHA}" >/dev/null 2>&1; then
              alias_ready=true
              break
            fi
            [ "${attempt}" = "10" ] || sleep 2
          done
          [ "${alias_ready}" = "true" ] || {
            echo "Canonical maintenance alias did not resolve to the verified deployment." >&2
            exit 1
          }
          {
            echo "deployment_host=${deployment_host}"
            echo "deployment_id=${deployment_id}"
            echo "deployment_invocation=${DEPLOY_INVOCATION_ID}"
          } >> "${GITHUB_OUTPUT}"
          node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
            advance "${CUTOVER_STATE_FILE}" maintenance_aliased

      - name: Drain pre-maintenance Vercel invocations
        if: steps.release_boundary.outputs.release_mode == 'atomic_cutover'
        run: |
          set -euo pipefail
          node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
            wait-vercel-drain vercel.json
          node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
            advance "${CUTOVER_STATE_FILE}" legacy_invocations_drained

      - name: Verify frozen inventory after drain
        if: steps.release_boundary.outputs.release_mode == 'atomic_cutover'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          node scripts/audit-cashflow-settlement-cycle-rollout.mjs \
            --firebase-project "${PROJECT_ID}" \
            --tenant mysc \
            --output "${CUTOVER_POST_DRAIN_REPORT}"
          node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
            verify-preflight "${CUTOVER_PLAN_FILE}" "${CUTOVER_POST_DRAIN_REPORT}"

      - name: Capture protected settlement and weekly completion state
        if: steps.release_boundary.outputs.release_mode == 'atomic_cutover'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
            capture-protected "${PROJECT_ID}" mysc "${PROTECTED_SNAPSHOT_FILE}" "${CUTOVER_PLAN_FILE}"

      - name: Dry-run and apply frozen settlement migrations
        if: steps.release_boundary.outputs.release_mode == 'atomic_cutover'
        env:
          CANDIDATE_URL: ${{ steps.target.outputs.url }}
          JVM_AUDIENCE: ${{ steps.target.outputs.service_url }}
          JVM_WEEKLY_API_ID_TOKEN: ${{ steps.service_auth.outputs.id_token }}
          JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          SETTLEMENT_MIGRATION_PROJECTS: ${{ steps.settlement_preflight.outputs.candidate_projects }}
          SETTLEMENT_NORMALIZATION_PROJECTS: ${{ steps.settlement_preflight.outputs.normalization_projects }}
          REVISION: ${{ steps.target.outputs.revision }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
          test "$(jq -r --arg revision "${REVISION}" \
            '[.status.traffic[] | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
            <<< "${service_json}")" = "0"
          test "$(jq -r '[.status.traffic[] | (.percent // 0)] | add // 0' \
            <<< "${service_json}")" = "100"
          test "$(jq -r \
            '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | unique | length' \
            <<< "${service_json}")" = "1"
          node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
            advance "${CUTOVER_STATE_FILE}" migration_started
          node scripts/audit-cashflow-settlement-cycle-rollout.mjs \
            --apply \
            --firebase-project "${PROJECT_ID}" \
            --confirm-project "${PROJECT_ID}" \
            --tenant mysc \
            --confirm-tenant mysc \
            --allow-projects "${SETTLEMENT_MIGRATION_PROJECTS}" \
            --normalize-projects "${SETTLEMENT_NORMALIZATION_PROJECTS}" \
            --people-uid "${CASHFLOW_ACTOR_UID}" \
            --reason "Automatic atomic cutover for ${DEPLOY_SHA}" \
            --jvm-base-url "${CANDIDATE_URL}" \
            --jvm-audience "${JVM_AUDIENCE}"

      - name: Verify settlement-cycle inventory and BFF read compatibility
        if: steps.release_boundary.outputs.release_mode == 'atomic_cutover' || steps.release_boundary.outputs.release_mode == 'final_web_resume'
        env:
          CANDIDATE_URL: ${{ steps.target.outputs.url }}
          JVM_AUDIENCE: ${{ steps.target.outputs.service_url }}
          JVM_WEEKLY_API_ID_TOKEN: ${{ steps.service_auth.outputs.id_token }}
          JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          RELEASE_MODE: ${{ steps.release_boundary.outputs.release_mode }}
          SETTLEMENT_NORMALIZATION_PROJECTS: ${{ steps.settlement_preflight.outputs.normalization_projects || 'p1773817948751,p1775209262483,p1780662870530' }}
        run: |
          set -euo pipefail
          test -n "${CASHFLOW_ACTOR_UID}"
          verify_url="${CANDIDATE_URL}"
          if [ "${RELEASE_MODE}" = "final_web_resume" ]; then
            verify_url="${JVM_AUDIENCE}"
          fi
          node scripts/audit-cashflow-settlement-cycle-rollout.mjs \
            --firebase-project "${PROJECT_ID}" \
            --tenant mysc \
            --verify-cutover \
            --normalize-projects "${SETTLEMENT_NORMALIZATION_PROJECTS}" \
            --people-uid "${CASHFLOW_ACTOR_UID}" \
            --jvm-base-url "${verify_url}" \
            --jvm-audience "${JVM_AUDIENCE}"
          if [ "${RELEASE_MODE}" = "atomic_cutover" ]; then
            node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
              verify-protected "${PROJECT_ID}" mysc "${PROTECTED_SNAPSHOT_FILE}" "${CUTOVER_PLAN_FILE}"
            node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
              advance "${CUTOVER_STATE_FILE}" inventory_verified
          fi

      - name: Promote verified candidate
        id: promote
        if: steps.release_boundary.outputs.release_mode != 'final_web_resume'
        env:
          REVISION: ${{ steps.target.outputs.revision }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --to-revisions "${REVISION}=100" \
            --set-tags "candidate=${REVISION}"

      - name: Verify canonical service after promotion
        id: canonical_canary
        env:
          REVISION: ${{ steps.target.outputs.revision }}
          ID_TOKEN: ${{ steps.service_auth.outputs.id_token }}
          JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
          ATOMIC_CUTOVER: ${{ steps.release_boundary.outputs.release_mode == 'atomic_cutover' }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail

          service_json="$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
          test "$(jq -r --arg revision "${REVISION}" \
            '[.status.traffic[] | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
            <<< "${service_json}")" = "100"
          test "$(jq -r \
            '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | unique | length' \
            <<< "${service_json}")" = "1"
          test "$(jq -r '[.status.traffic[] | (.percent // 0)] | add // 0' \
            <<< "${service_json}")" = "100"
          canonical_url="$(jq -er '.status.url' <<< "${service_json}")"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "${canonical_url}/api/v1/health" \
            | jq -e '.ok == true and .service == "jvm-weekly-api" and (.capabilities | index("settlement-cycle-v1") != null)' >/dev/null
          canonical_cycle_dashboard="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "x-inner-platform-service-token: ${JVM_WEEKLY_INTERNAL_API_TOKEN}" \
            -H 'x-tenant-id: mysc' \
            -H "x-actor-id: ${CASHFLOW_ACTOR_UID}" \
            -H 'x-actor-role: ADMIN' \
            "${canonical_url}/api/v1/cashflow/${CASHFLOW_PROJECT_ID}/month-close/dashboard-source?yearMonth=${CASHFLOW_YEAR_MONTH}&settlementCycle=true")"
          node scripts/verify-cashflow-settlement-cycle-projection.mjs \
            "${CASHFLOW_PROJECT_ID}" \
            "${CASHFLOW_YEAR_MONTH}" \
            <<< "${canonical_cycle_dashboard}" >/dev/null
          if [ "${ATOMIC_CUTOVER}" = "true" ]; then
            node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
              advance "${CUTOVER_STATE_FILE}" jvm_promoted
          fi

      - name: Deploy and activate canonical web
        id: final_web
        if: steps.release_boundary.outputs.release_mode == 'atomic_cutover' || steps.release_boundary.outputs.release_mode == 'final_web_resume'
        env:
          SERVICE_URL: ${{ steps.target.outputs.service_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
          JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON: ${{ secrets.JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON_LIVE }}
          SLACK_ALERT_BOT_TOKEN: ${{ secrets.SLACK_ALERT_BOT_TOKEN }}
          SETTLEMENT_CANARY_FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY_LIVE }}
          SETTLEMENT_CANARY_FIREBASE_REFRESH_TOKEN: ${{ secrets.FIREBASE_SETTLEMENT_READ_CANARY_REFRESH_TOKEN_LIVE }}
          SETTLEMENT_CANARY_ACTOR_UID: ${{ vars.SETTLEMENT_READ_CANARY_ACTOR_UID_LIVE }}
          SETTLEMENT_CANARY_PROJECT_ID: ${{ vars.JVM_SETTLEMENT_CANARY_PROJECT_ID_LIVE }}
          SETTLEMENT_CANARY_CYCLE_YEAR_MONTH: ${{ vars.JVM_SETTLEMENT_CANARY_CYCLE_YEAR_MONTH_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_REQUEST_ID: ${{ vars.SETTLEMENT_CANARY_EXPECTED_REQUEST_ID_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_STATUS: ${{ vars.SETTLEMENT_CANARY_EXPECTED_STATUS_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_WORKFLOW_REVISION: ${{ vars.SETTLEMENT_CANARY_EXPECTED_WORKFLOW_REVISION_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_EVIDENCE_REVISION: ${{ vars.SETTLEMENT_CANARY_EXPECTED_EVIDENCE_REVISION_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_TARGET_YEAR_MONTH: ${{ vars.SETTLEMENT_CANARY_EXPECTED_TARGET_YEAR_MONTH_LIVE }}
          SETTLEMENT_CANARY_EXPECTED_ACTIONS: ${{ vars.SETTLEMENT_CANARY_EXPECTED_ACTIONS_LIVE }}
          SETTLEMENT_CANARY_TENANT_ID: mysc
          SETTLEMENT_CANARY_CANONICAL_ORIGIN: https://myscube.myscguard.app
        run: |
          set -euo pipefail
          author_email="$(git show -s --format=%ae HEAD)"
          test "${author_email}" = "ai@mysc.co.kr"
          deployment="$(JVM_WEEKLY_API_BASE_URL="${SERVICE_URL}" \
            JVM_WEEKLY_API_ID_TOKEN_AUDIENCE="${SERVICE_URL}" \
            node scripts/deploy-vercel-production-candidate.mjs \
              --source-dir . \
              --commit-sha "${DEPLOY_SHA}" \
              --invocation "${DEPLOY_INVOCATION_ID}" \
              --maintenance false)"
          deployment_url="$(jq -er .deploymentUrl <<< "${deployment}")"
          deployment_host="$(jq -er .deploymentHost <<< "${deployment}")"
          identity="$(node scripts/verify-vercel-deployment-identity.mjs \
            --host "${deployment_host}" \
            --expected-sha "${DEPLOY_SHA}" \
            --expected-invocation "${DEPLOY_INVOCATION_ID}" \
            --ancestor-of "${DEPLOY_SHA}")"
          deployment_id="$(jq -er .id <<< "${identity}")"

          assert_live() {
            local base_url="$1"
            local bypass_header=()
            if [ -n "${2:-}" ]; then
              bypass_header=(-H "x-vercel-protection-bypass: $2")
            fi
            curl --fail --silent --show-error "${bypass_header[@]}" \
              "${base_url}/api/v1/health" \
              | jq -e '.projectId == env.LIVE_FIREBASE_PROJECT_ID and .authMode == "firebase_required"' >/dev/null
            mutation="$(curl --silent --show-error "${bypass_header[@]}" \
              -X POST -H 'content-type: application/json' -d '{}' \
              -w '\n%{http_code}' "${base_url}/api/v1/__maintenance_probe__")"
            test "${mutation##*$'\n'}" = "400"
            test "$(jq -r '.error // ""' <<< "${mutation%$'\n'*}")" != "maintenance_read_only"
            worker="$(curl --silent --show-error "${bypass_header[@]}" \
              -w '\n%{http_code}' "${base_url}/api/internal/workers/outbox/run")"
            test "${worker##*$'\n'}" = "401"
            jq -e '.error == "unauthorized_worker"' <<< "${worker%$'\n'*}" >/dev/null
          }
          assert_live "${deployment_url}" "${VERCEL_AUTOMATION_BYPASS_SECRET}"
          SETTLEMENT_CANARY_BASE_URL="${deployment_url}" \
            node scripts/verify-cashflow-settlement-candidate.mjs
          npx --yes "${VERCEL_CLI_PACKAGE}" alias set \
            "${deployment_host}" "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
            --token "${VERCEL_TOKEN}" --scope merryai-devs-projects
          alias_ready=false
          for attempt in {1..10}; do
            if node scripts/verify-vercel-deployment-identity.mjs \
                --alias-host "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
                --expected-host "${deployment_host}" \
                --expected-id "${deployment_id}" \
                --expected-sha "${DEPLOY_SHA}" \
                --expected-invocation "${DEPLOY_INVOCATION_ID}" \
                --ancestor-of "${DEPLOY_SHA}" >/dev/null 2>&1; then
              alias_ready=true
              break
            fi
            [ "${attempt}" = "10" ] || sleep 2
          done
          [ "${alias_ready}" = "true" ] || {
            echo "Canonical alias did not resolve to the verified deployment." >&2
            exit 1
          }
          node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
            advance "${CUTOVER_STATE_FILE}" final_web_aliased

      # update-traffic 이 서버에 반영된 뒤 CLI 응답만 유실될 수 있다. step outcome만 믿지 않고
      # 실제 traffic을 다시 읽어 성공이면 candidate 100%, 실패면 이전 revision 100%를 강제한다.
      - name: Reconcile promotion traffic or roll back
        if: always() && steps.target.outcome == 'success' && steps.promote.outcome != 'skipped'
        env:
          CANDIDATE_REVISION: ${{ steps.target.outputs.revision }}
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          CANARY_OUTCOME: ${{ steps.canonical_canary.outcome }}
          FINAL_WEB_OUTCOME: ${{ steps.final_web.outcome }}
          ATOMIC_CUTOVER: ${{ steps.release_boundary.outputs.release_mode == 'atomic_cutover' }}
          ID_TOKEN: ${{ steps.service_auth.outputs.id_token }}
          JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          candidate_percent=""
          previous_percent=""
          positive_revision_count=""
          total_percent=""

          read_traffic() {
            local traffic_json
            traffic_json="$(gcloud run services describe "${SERVICE}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --format=json)" || return 1
            candidate_percent="$(jq -r --arg revision "${CANDIDATE_REVISION}" \
              '[.status.traffic[] | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
              <<< "${traffic_json}")"
            previous_percent="$(jq -r --arg revision "${PREVIOUS_REVISION}" \
              '[.status.traffic[] | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
              <<< "${traffic_json}")"
            positive_revision_count="$(jq -r \
              '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | unique | length' \
              <<< "${traffic_json}")"
            total_percent="$(jq -r '[.status.traffic[] | (.percent // 0)] | add // 0' <<< "${traffic_json}")"
          }

          if [ "${PROMOTE_OUTCOME}" = "success" ] \
            && [ "${CANARY_OUTCOME}" = "success" ] \
            && { [ "${ATOMIC_CUTOVER}" != "true" ] || [ "${FINAL_WEB_OUTCOME}" = "success" ]; }; then
            for attempt in {1..10}; do
              if read_traffic \
                && [ "${candidate_percent}" = "100" ] \
                && [ "${positive_revision_count}" = "1" ] \
                && [ "${total_percent}" = "100" ]; then
                exit 0
              fi
              [ "${attempt}" = "10" ] || sleep 3
            done
          fi

          if [ "${ATOMIC_CUTOVER}" = "true" ]; then
            echo "Atomic migration started; JVM rollback is unsafe and maintenance remains active." >&2
            exit 1
          fi

          if [ -z "${PREVIOUS_REVISION}" ]; then
            echo "Candidate verification failed and no previous revision exists for rollback." >&2
            exit 1
          fi

          rollback_status=0
          gcloud run services update-traffic "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --to-revisions "${PREVIOUS_REVISION}=100" \
            --set-tags "candidate=${CANDIDATE_REVISION}" || rollback_status=$?

          for attempt in {1..10}; do
            if read_traffic \
              && [ "${candidate_percent}" = "0" ] \
              && [ "${previous_percent}" = "100" ] \
              && [ "${positive_revision_count}" = "1" ] \
              && [ "${total_percent}" = "100" ]; then
              break
            fi
            [ "${attempt}" = "10" ] || sleep 3
          done
          test "${candidate_percent}" = "0"
          test "${previous_percent}" = "100"
          test "${positive_revision_count}" = "1"
          test "${total_percent}" = "100"

          canonical_url="$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "${canonical_url}/api/v1/health" \
            | jq -e '.ok == true and .service == "jvm-weekly-api" and .runtime == "spring-boot"' >/dev/null
          if [ "${rollback_status}" != "0" ]; then
            echo "Traffic rollback command lost its response, but the restored topology and canary were verified." >&2
          fi
          exit 1

      - name: Reconcile atomic web alias after failure
        if: always() && steps.cutover_sequence.outcome == 'success'
        env:
          PREVIOUS_DEPLOYMENT_HOST: ${{ steps.release_boundary.outputs.bff_deployment_host }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.release_boundary.outputs.bff_deployment_id }}
          PREVIOUS_DEPLOYMENT_SHA: ${{ steps.release_boundary.outputs.bff_deployed_sha }}
          MAINTENANCE_DEPLOYMENT_HOST: ${{ steps.maintenance_web.outputs.deployment_host || steps.release_boundary.outputs.bff_deployment_host }}
          MAINTENANCE_DEPLOYMENT_ID: ${{ steps.maintenance_web.outputs.deployment_id || steps.release_boundary.outputs.bff_deployment_id }}
          MAINTENANCE_DEPLOYMENT_INVOCATION: ${{ steps.maintenance_web.outputs.deployment_invocation || steps.release_boundary.outputs.bff_deployment_invocation }}
          CANDIDATE_REVISION: ${{ steps.target.outputs.revision }}
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
          BFF_SPLIT_RELEASE_BASE_SHA: ${{ vars.BFF_SPLIT_RELEASE_BASE_SHA_LIVE }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          plan="$(node scripts/verify-cashflow-settlement-cutover-sequence.mjs \
            failure-plan "${CUTOVER_STATE_FILE}")"
          if jq -e '.restoreOriginalAlias == false and .keepMaintenance == false' \
            <<< "${plan}" >/dev/null; then
            exit 0
          fi
          if jq -e '.restoreOriginalAlias == true' <<< "${plan}" >/dev/null; then
            target_host="${PREVIOUS_DEPLOYMENT_HOST}"
            target_id="${PREVIOUS_DEPLOYMENT_ID}"
            target_sha="${PREVIOUS_DEPLOYMENT_SHA}"
            invocation_args=(--legacy-missing-invocation-sha "${BFF_SPLIT_RELEASE_BASE_SHA}")
            service_json="$(gcloud run services describe "${SERVICE}" \
              --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
            candidate_percent="$(jq -r --arg revision "${CANDIDATE_REVISION}" \
              '[.status.traffic[] | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
              <<< "${service_json}")"
            if [ "${candidate_percent}" != "0" ]; then
              gcloud run services update-traffic "${SERVICE}" \
                --project "${PROJECT_ID}" --region "${REGION}" \
                --to-revisions "${PREVIOUS_REVISION}=100" \
                --set-tags "candidate=${CANDIDATE_REVISION}"
            fi
          else
            target_host="${MAINTENANCE_DEPLOYMENT_HOST}"
            target_id="${MAINTENANCE_DEPLOYMENT_ID}"
            target_sha="${PREVIOUS_DEPLOYMENT_SHA}"
            test -n "${MAINTENANCE_DEPLOYMENT_INVOCATION}"
            invocation_args=(--expected-invocation "${MAINTENANCE_DEPLOYMENT_INVOCATION}")
          fi
          test -n "${target_host}"
          test -n "${target_id}"
          npx --yes "${VERCEL_CLI_PACKAGE}" alias set \
            "${target_host}" "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
            --token "${VERCEL_TOKEN}" --scope merryai-devs-projects
          alias_ready=false
          for attempt in {1..10}; do
            if node scripts/verify-vercel-deployment-identity.mjs \
                --alias-host "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
                --expected-host "${target_host}" \
                --expected-id "${target_id}" \
                --expected-sha "${target_sha}" \
                "${invocation_args[@]}" \
                --ancestor-of "${DEPLOY_SHA}" >/dev/null 2>&1; then
              alias_ready=true
              break
            fi
            [ "${attempt}" = "10" ] || sleep 2
          done
          [ "${alias_ready}" = "true" ] || {
            echo "Canonical alias reconciliation did not resolve to the verified deployment." >&2
            exit 1
          }
          if jq -e '.keepMaintenance == true' <<< "${plan}" >/dev/null; then
            mutation="$(curl --silent --show-error -X POST \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              -H 'content-type: application/json' -d '{}' -w '\n%{http_code}' \
              "https://${target_host}/api/v1/__maintenance_probe__")"
            test "${mutation##*$'\n'}" = "503"
            jq -e '.error == "maintenance_read_only"' <<< "${mutation%$'\n'*}" >/dev/null
            worker="$(curl --silent --show-error -w '\n%{http_code}' \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "https://${target_host}/api/internal/workers/outbox/run")"
            test "${worker##*$'\n'}" = "503"
            jq -e '.error == "worker_scheduler_disabled"' <<< "${worker%$'\n'*}" >/dev/null
          fi
