name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  cashflow-sheet-lab-one-way-freeze:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Require owner approval for sheet one-way changes
        env:
          CASHFLOW_SHEET_LAB_FREEZE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CASHFLOW_SHEET_LAB_FREEZE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CASHFLOW_SHEET_LAB_FREEZE_PULL_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check_cashflow_sheet_lab_freeze.mjs

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # vite strips types without checking them, so this is what catches an
      # undefined identifier before it reaches production as a runtime crash.
      - name: Typecheck (no new errors)
        run: npm run typecheck

      - name: RBAC policy verify
        run: npm run policy:verify

      - name: Production build
        run: npm run build

  product-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: BFF Firestore emulator integration
        run: npm run bff:test:integration

      - name: JVM weekly API tests
        run: mvn -f server/jvm-weekly-api/pom.xml test

      - name: JVM settlement Firestore emulator integration
        run: bash server/jvm-weekly-api/scripts/test-settlement-cycle-emulator.sh

      - name: Settlement targeted vitest matrix
        run: npx vitest run src/app/platform/settlement-*.test.ts src/app/platform/weekly-accounting-state.test.ts src/app/data/portal-store.settlement.test.ts src/app/data/portal-store.integration.test.ts src/app/data/cashflow-weeks-store.integration.test.ts

      - name: Settlement emulator-backed integration
        run: npm run test:settlement:integration

  edge-security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Strict Cloudflare edge smoke
        env:
          CLOUDFLARE_EDGE_ALLOW_CHALLENGE: '1'
        run: npm run security:edge-smoke:strict

      - name: Upload edge smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-edge-smoke
          path: tmp/edge-smoke/cloudflare-edge-smoke.json
          if-no-files-found: warn
